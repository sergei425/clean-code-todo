<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>
  <body>
    <div class="matrix">
      <img src="./eisenhower-matrix.jpg" />
      <a class="matrix__link" href="https://goal-life.com/page/method/matrix-eisenhower"> Want more details&quest; </a>
    </div>
    p
    <div class="main">
      <div class="add-task__wrapper">
        <label class="add-task__label" for="new-task">Add Item</label
        ><input id="new-task" class="add-task__input" type="text" /><button>Add</button>
      </div>
      <h3>Todo</h3>
      <ul id="incompleteTasks" class="tasks tasks--incomplete">
        <li class="tasks__item">
          <input type="checkbox" /><label class="tasks__label">Pay Bills</label
          ><input type="text" class="tasks__input" /><button class="tasks__edit">Edit</button
          ><button class="tasks__delete"><img src="./remove.svg" /></button>
        </li>
        <li class="tasks__item tasks__item--edit">
          <input type="checkbox" /><label class="tasks__label">Go Shopping</label
          ><input type="text" value="Go Shopping" class="tasks__input" /><button class="tasks__edit">Save</button
          ><button class="tasks__delete"><img src="./remove.svg" /></button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks" class="tasks tasks--completed">
        <li class="tasks__item">
          <input type="checkbox" checked /><label class="tasks__label tasks__label--completed">See the Doctor</label
          ><input type="text" class="tasks__input" /><button class="tasks__edit">Edit</button
          ><button class="tasks__delete"><img src="./remove.svg" /></button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
